[paths]
samples_file = samples.csv
augustus_config_path = augustus_config

[containers]
braker3_image = docker://teambraker/braker3:v3.0.10

[PARAMS]
fungus = 0
min_contig = 10000
use_varus = 0
skip_optimize_augustus = 1
skip_busco = 1
run_best_by_compleasm = 0
masking_tool = repeatmasker 
run_ncrna = 0
no_cleanup = 0

[SLURM_ARGS]
cpus_per_task = 16
mem_of_node = 90000
max_runtime = 86400